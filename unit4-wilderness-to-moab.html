<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wilderness to Moab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}

/* Layout: one narrow column; a strip of the five Hebrew book titles heads the page with this unit's books lit; tekhelet blue (the thread of Num 15:38) is the only accent. */
:root{
  --bg:#EDF0EF; --surface:#F8FAF9; --ink:#15232B; --muted:#55656D; --line:#C9D3D6;
  --accent:#1D4E75; --accent-ink:#FFFFFF;
  --good:#1E6B45; --good-bg:#DCEFE4; --bad:#A8382F; --bad-bg:#F6DEDA;
  --display:"Frank Ruhl Libre","Times New Roman",serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E181E; --surface:#16242C; --ink:#E5EDF0; --muted:#93A5AD; --line:#2B3E48;
  --accent:#7DB3E0; --accent-ink:#0E181E;
  --good:#5CC08A; --good-bg:#173A29; --bad:#F08A80; --bad-bg:#3F1D1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E181E; --surface:#16242C; --ink:#E5EDF0; --muted:#93A5AD; --line:#2B3E48;
  --accent:#7DB3E0; --accent-ink:#0E181E;
  --good:#5CC08A; --good-bg:#173A29; --bad:#F08A80; --bad-bg:#3F1D1A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line);padding-bottom:16px}
.books{display:flex;flex-wrap:wrap;gap:4px 18px;font-family:var(--display);font-size:1.15rem;direction:ltr}
.books span{direction:rtl;unicode-bidi:isolate;color:var(--muted);opacity:.55}
.books span.on{color:var(--accent);opacity:1;font-weight:700}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:2.1rem;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:.95rem}
.lead{margin:0;font-size:1.02rem;max-width:62ch}

ol.rounds{margin:0;padding:0;list-style:none;counter-reset:r;border-top:1px solid var(--line)}
ol.rounds li{counter-increment:r;display:grid;grid-template-columns:2rem 1fr;gap:0 4px;padding:12px 4px;border-bottom:1px solid var(--line)}
ol.rounds li::before{content:counter(r);grid-row:span 2;font-family:var(--display);font-size:1.4rem;color:var(--accent);font-variant-numeric:tabular-nums}
ol.rounds strong{font-weight:600}
ol.rounds span{color:var(--muted);font-size:.9rem}

.bar{display:flex;justify-content:space-between;gap:12px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);transition:width .25s}

.q{font-family:var(--display);font-size:1.4rem;line-height:1.3;margin:0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{flex-direction:row}
.opts.two .opt{flex:1;text-align:center;font-weight:600}
.opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.good{background:var(--good-bg);border-color:var(--good)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb{border-left:3px solid var(--accent);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:2px}
.fb strong{font-weight:600}
.fb .ref{color:var(--muted);font-size:.85rem}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:12px 22px;font-weight:600;align-self:flex-start}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:11px 20px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.besttxt{color:var(--muted);font-size:.9rem}

.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.pairs .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:.92rem;min-width:0;overflow-wrap:anywhere}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tile.done{background:var(--good-bg);border-color:var(--good);cursor:default}
.tile.wrong{background:var(--bad-bg);border-color:var(--bad)}

.tray{display:flex;flex-wrap:wrap;gap:8px}
.item{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:.92rem;max-width:100%;overflow-wrap:anywhere}
.item.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.targets{display:grid;gap:10px}
.targets.view-buckets{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.targets.view-blanks{grid-template-columns:1fr}
.targets.view-frame{grid-template-columns:1fr;justify-items:center}
.targets.view-plan{border:2px solid var(--accent);border-radius:4px;padding:8px;gap:6px}
.tg{background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:10px 12px;text-align:left;width:100%;min-width:0;display:flex;flex-direction:column;gap:4px}
.tg:hover:not(:disabled){border-color:var(--accent)}
.tg:disabled{cursor:default}
.tg.full{border-style:solid;border-color:var(--good)}
.tg.bad{background:var(--bad-bg);border-color:var(--bad);border-style:solid}
.tg .tl{font-weight:600}
.tg .ts{color:var(--muted);font-size:.82rem}
.put{display:block;font-size:.88rem;padding:6px 8px;background:var(--good-bg);border:1px solid var(--good);border-radius:4px}
.blank{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--accent);text-align:center;font-weight:600;color:var(--good)}
.tg.zone-tent{border-color:var(--accent)}
.edge{color:var(--muted);font-size:.8rem;text-align:center;letter-spacing:.06em;text-transform:uppercase}

.result{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:20px}
.big{font-family:var(--display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
table.res{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
table.res td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.res td:last-child{text-align:right;font-weight:600}
@media (prefers-reduced-motion:reduce){.track i{transition:none}}
@media (max-width:420px){h1{font-size:1.75rem}.q{font-size:1.2rem}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="books" id="books" aria-label="The five books of the Pentateuch in Hebrew"></div>

    <p class="sub" id="gsub"></p>
  </header>
  <main id="app"></main>
</div>

<script>
var GAME={"key": "u4", "title": "Wilderness to Moab", "eyebrow": "Introduction to the Pentateuch · Unit IV · Lessons 7–8", "tagline": "Numbers and Deuteronomy: rebellion, mercy and Moses’ farewell.", "books": [3, 4], "intro": "Review Lessons 7 and 8: the camp and the Levites, the cases of rebellion, the shape of Deuteronomy and its treaty form. Each answer you get right on the first try scores a point.", "rounds": [{"type": "assign", "view": "buckets", "name": "Pack the tabernacle", "blurb": "Give each load to the Levitical clan that carried it.", "targets": [{"id": "G", "label": "Gershonites", "sub": "Under Ithamar"}, {"id": "K", "label": "Kohathites", "sub": "Under Eleazar"}, {"id": "M", "label": "Merarites", "sub": "Under Ithamar"}], "items": [{"x": "The coverings of the tabernacle and tent", "t": "G", "n": "Gershonites: coverings, curtains and related articles (Num 3:21–26)."}, {"x": "The curtains", "t": "G", "n": "Gershonites: coverings, curtains and related articles."}, {"x": "The ark", "t": "K", "n": "Kohathites carried the sanctuary articles (Num 3:27–32)."}, {"x": "The table and the lampstand", "t": "K", "n": "Kohathites carried the sanctuary articles."}, {"x": "The altars and the veil", "t": "K", "n": "Kohathites carried the sanctuary articles."}, {"x": "The frames, crossbars and posts", "t": "M", "n": "Merarites: the tabernacle and courtyard frames (Num 3:33–37)."}, {"x": "The bases and pegs", "t": "M", "n": "Merarites: bases, pegs and the heavier structure."}]}, {"type": "match", "name": "Rebellion and mercy", "blurb": "Match each case of rebellion to what followed.", "pairs": [{"a": "Kibroth-hattaavah (11:4–34)", "b": "Seventy elders share Moses’ burden; quail and a plague"}, {"a": "Aaron and Miriam (12)", "b": "Miriam is made leprous, then healed after Moses’ plea"}, {"a": "The spies at Kadesh (13–14)", "b": "The generation aged 20 and over, except Joshua and Caleb, dies in the wilderness"}, {"a": "Korah and others (16:1–40)", "b": "The earth swallows some and fire consumes 250"}, {"a": "Moses and Aaron at the water (20:1–13)", "b": "Moses and Aaron will not enter the land"}, {"a": "Poisonous serpents (21:4–9)", "b": "A bronze serpent on a pole brings life to those who look"}, {"a": "Harlotry at Peor (25)", "b": "A plague kills 24,000 until Phinehas acts"}]}, {"type": "assign", "view": "frame", "name": "Frame the farewell", "blurb": "Place each part of Deuteronomy in its chapters.", "targets": [{"id": "A", "label": "Chapters 1–3", "sub": "Outer frame (A)", "w": 100}, {"id": "B", "label": "Chapters 4–11", "sub": "Inner frame (B)", "w": 88}, {"id": "C", "label": "Chapters 12–26", "sub": "Central core (C)", "w": 76}, {"id": "B2", "label": "Chapters 27–30", "sub": "Inner frame (B′)", "w": 88}, {"id": "A2", "label": "Chapters 31–34", "sub": "Outer frame (A′)", "w": 100}], "items": [{"x": "A look backward", "t": "A", "n": "Moses recalls what God has done."}, {"x": "The great exhortation", "t": "B", "n": "It includes the Shema in 6:4–9."}, {"x": "The stipulations of the covenant", "t": "C", "n": "The core sits at the centre of the frame."}, {"x": "The covenant ceremony", "t": "B2", "n": "It includes the blessings and curses."}, {"x": "A look forward", "t": "A2", "n": "Succession, the song and the death of Moses."}]}, {"type": "match", "name": "Deuteronomy as treaty", "blurb": "Match each treaty element to its place in Deuteronomy.", "pairs": [{"a": "Preamble", "b": "1:1–5"}, {"a": "Historical prologue", "b": "1:6–4:49"}, {"a": "Detailed stipulations", "b": "Chapters 12–26"}, {"a": "Blessings and curses", "b": "28:1–68"}, {"a": "Deposit and public reading", "b": "31:9–13, 24–26"}]}, {"type": "choose", "kind": "tf", "n": 8, "name": "True or false", "blurb": "Eight statements on Numbers and Deuteronomy.", "items": [{"q": "The two censuses of Numbers fall in chapters 1 and 26.", "a": true, "e": "They give the Greek title arithmoi. Olson divides the book by them.", "r": "Lesson 7, Section 7.1"}, {"q": "Olson calls Numbers 1:1–25:18 “the birth of the new.”", "a": false, "e": "Numbers 1:1–25:18 is “the death of the old.” Chapters 26–36 are “the birth of the new.”", "r": "Lesson 7, Section 7.1"}, {"q": "Numbers 1:1–10:10 covers about 38 years at Sinai.", "a": false, "e": "That section covers about 19 days. The wilderness years of about 38 years and 4 months follow.", "r": "Lesson 7, Table 7.1"}, {"q": "The priestly blessing of Numbers 6:22–27 puts God’s name on his people.", "a": true, "e": "It stands against the repeated curses on rebellion.", "r": "Lesson 7, Section 7.4"}, {"q": "The Balaam oracles show that a pagan seer cannot curse what God has blessed.", "a": true, "e": "The oracles are in Numbers 22–24.", "r": "Lesson 7, Section 7.4"}, {"q": "Moses and Aaron were barred from the land because they killed an Egyptian.", "a": false, "e": "The bar follows Numbers 20:1–13, when they angrily rebuked the people at the water and did not fully obey.", "r": "Lesson 7, Table 7.3"}, {"q": "The Shema begins with the Hebrew word meaning “hear.”", "a": true, "e": "Shema, “Hear, O Israel,” is the creed of Israel (Deut 6:4–9).", "r": "Lesson 8, Section 8.1"}, {"q": "God chose Israel because of Israel’s greatness.", "a": false, "e": "Election rested on God’s promises to the patriarchs and his unmerited love (Deut 7:7–8; 9:5–6).", "r": "Lesson 8, Section 8.3"}, {"q": "The covenant curses were always portrayed as discipline, not the end of the relationship.", "a": true, "e": "They were designed to draw Israel back to the LORD (Deut 8:5; 30:1–3).", "r": "Lesson 8, Section 8.3"}, {"q": "Deuteronomy 4:5–8 links election and mission.", "a": true, "e": "Obedience becomes a godly witness before the nations.", "r": "Lesson 8, Section 8.3"}, {"q": "Meredith Kline proposed in 1963 that Deuteronomy follows the outline of Hittite treaties.", "a": true, "e": "The parallel helps us hear the book as covenant renewal.", "r": "Lesson 8, Section 8.2"}]}]};
(function(){
var G=GAME,app=document.getElementById('app'),S=null;
var HEB=['בראשית','שמות','ויקרא','במדבר','דברים'];
document.getElementById('books').innerHTML=HEB.map(function(h,i){return '<span lang="he"'+(G.books.indexOf(i)>=0?' class="on"':'')+'>'+h+'</span>'}).join('');
document.getElementById('eyebrow').textContent=G.eyebrow;
document.getElementById('gtitle').textContent=G.title;
document.getElementById('gsub').textContent=G.tagline;

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
var store={
  get:function(k){try{return JSON.parse(localStorage.getItem('pc-'+G.key+'-'+k))}catch(e){return null}},
  set:function(k,v){try{localStorage.setItem('pc-'+G.key+'-'+k,JSON.stringify(v))}catch(e){}}
};
function show(h){app.innerHTML=h;window.scrollTo(0,0)}
function bar(label){var n=G.rounds.length;return '<div class="bar"><span>'+esc(label)+'</span><span>'+S.hits+' first try</span></div><div class="track"><i style="width:'+(S.r/n*100)+'%"></i></div>'}
function head(){var R=G.rounds[S.r];return bar('Round '+(S.r+1)+' of '+G.rounds.length+' · '+R.name)}

function intro(){
  var best=store.get('best');
  show('<div class="stack"><p class="lead">'+esc(G.intro)+'</p><ol class="rounds">'+
    G.rounds.map(function(r){return '<li><strong>'+esc(r.name)+'</strong><span>'+esc(r.blurb)+'</span></li>'}).join('')+
    '</ol><div class="row"><button class="primary" id="go">Start</button>'+(best!==null?'<span class="besttxt">Best score: '+best+'%</span>':'')+'</div></div>');
  document.getElementById('go').onclick=start;
}
function start(){S={r:0,hits:0,total:0,res:[]};run()}
function run(){
  var R=G.rounds[S.r];
  if(R.type==='choose')runChoose(R);else if(R.type==='match')runMatch(R);else runAssign(R);
}
function done(hits,total){
  var R=G.rounds[S.r];
  hits=Math.max(0,Math.min(total,hits));
  S.res.push({name:R.name,hits:hits,total:total});S.hits+=hits;S.total+=total;S.r++;
  if(S.r>=G.rounds.length)return finish();
  var nx=G.rounds[S.r];
  show('<div class="stack">'+bar('Round '+S.r+' of '+G.rounds.length+' complete')+'<div class="result"><div class="label">'+esc(R.name)+'</div><div class="big">'+hits+' / '+total+'</div><p style="margin:0">right on the first try.</p><button class="primary" id="next">Next: '+esc(nx.name)+'</button></div></div>');
  document.getElementById('next').onclick=run;
}
function finish(){
  var pct=S.total?Math.round(S.hits/S.total*100):0;
  var prev=store.get('best');if(prev===null||pct>prev)store.set('best',pct);
  var msg=pct===100?'A perfect run.':pct>=80?'Strong grasp of this unit.':pct>=60?'A good base. Reread the sections behind the ones you missed.':'Go back through the lessons, then try again.';
  show('<div class="stack"><div class="track"><i style="width:100%"></i></div><div class="result"><div class="label">Game complete</div><div class="big">'+pct+'%</div><p style="margin:0">'+S.hits+' of '+S.total+' right on the first try. '+msg+'</p>'+
    '<table class="res">'+S.res.map(function(r){return '<tr><td>'+esc(r.name)+'</td><td>'+r.hits+' / '+r.total+'</td></tr>'}).join('')+'</table>'+
    '<div class="row"><button class="primary" id="again">Play again</button></div></div></div>');
  document.getElementById('again').onclick=start;
}

/* ---- choose: true/false or multiple choice ---- */
function runChoose(R){
  var pool=shuffle(R.items);if(R.n)pool=pool.slice(0,R.n);
  var qs=pool.map(function(x){
    var o;
    if(R.kind==='tf')o=[{t:'True',ok:x.a===true},{t:'False',ok:x.a===false}];
    else if(R.options)o=R.options.map(function(t,i){return {t:t,ok:i===x.a}});
    else o=shuffle(x.o.map(function(t,i){return {t:t,ok:i===0}}));
    return {q:x.q,e:x.e,r:x.r,o:o};
  });
  var i=0,hits=0;
  function step(){
    var q=qs[i],n=qs.length,last=i===n-1,answered=false;
    show('<div class="stack">'+head()+'<div class="label">'+(R.kind==='tf'?'True or false':'Question')+' '+(i+1)+' of '+n+'</div><p class="q">'+esc(q.q)+'</p><div class="opts'+(R.kind==='tf'?' two':'')+'" id="opts">'+
      q.o.map(function(o,j){return '<button class="opt" data-j="'+j+'">'+esc(o.t)+'</button>'}).join('')+'</div><div id="fb"></div></div>');
    var btns=app.querySelectorAll('.opt');
    btns.forEach(function(b){b.onclick=function(){
      if(answered)return;answered=true;
      var j=+b.getAttribute('data-j'),ok=q.o[j].ok;if(ok)hits++;
      btns.forEach(function(x,k){x.disabled=true;if(q.o[k].ok)x.classList.add('good');else if(k===j)x.classList.add('bad')});
      document.getElementById('fb').innerHTML='<div class="stack"><div class="fb"><strong>'+(ok?'Correct.':'Not quite.')+'</strong><span>'+esc(q.e)+'</span><span class="ref">'+esc(q.r)+'</span></div><button class="primary" id="nx">'+(last?'Finish round':'Next')+'</button></div>';
      var nx=document.getElementById('nx');nx.focus();
      nx.onclick=function(){if(last)done(hits,n);else{i++;step()}};
    }});
  }
  step();
}

/* ---- match: tap left, then its partner on the right ---- */
function runMatch(R){
  var total=R.pairs.length;
  var left=shuffle(R.pairs.map(function(p,i){return {id:i,t:p.a}})),right=shuffle(R.pairs.map(function(p,i){return {id:i,t:p.b}}));
  var s={sel:null,done:{},mist:0,lock:false,wl:null,wr:null};
  function draw(){
    var found=Object.keys(s.done).length;
    show('<div class="stack">'+head()+'<p class="sub" style="margin:0">'+esc(R.blurb)+' Tap one on the left, then its partner on the right.</p>'+
     '<div class="bar"><span>'+found+' of '+total+' matched</span><span>'+s.mist+' miss'+(s.mist===1?'':'es')+'</span></div>'+
     '<div class="pairs"><div class="col">'+left.map(function(x){
        var c='tile'+(s.done[x.id]?' done':'')+(s.sel===x.id?' sel':'')+(s.wl===x.id?' wrong':'');
        return '<button class="'+c+'" data-l="'+x.id+'"'+(s.done[x.id]?' disabled':'')+'>'+esc(x.t)+'</button>'}).join('')+'</div><div class="col">'+
      right.map(function(x){
        var c='tile'+(s.done[x.id]?' done':'')+(s.wr===x.id?' wrong':'');
        return '<button class="'+c+'" data-r="'+x.id+'"'+(s.done[x.id]?' disabled':'')+'>'+esc(x.t)+'</button>'}).join('')+'</div></div></div>');
    app.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){if(s.lock)return;s.sel=+b.getAttribute('data-l');draw()}});
    app.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){
      if(s.lock||s.sel===null)return;
      var r=+b.getAttribute('data-r');
      if(r===s.sel){s.done[r]=true;s.sel=null;if(Object.keys(s.done).length===total)done(total-s.mist,total);else draw()}
      else{s.mist++;s.lock=true;s.wl=s.sel;s.wr=r;draw();setTimeout(function(){s.lock=false;s.wl=s.wr=null;s.sel=null;draw()},700)}
    }});
  }
  draw();
}

/* ---- assign: pick a card, tap where it belongs ---- */
function runAssign(R){
  var cap=R.view==='buckets'?9999:1,total=R.items.length;
  var items=shuffle(R.items.map(function(x,i){return {id:i,t:x.t,x:x.x,n:x.n}}));
  var s={sel:null,placed:{},inT:{},miss:0,bad:null,note:null,count:0};
  R.targets.forEach(function(t){s.inT[t.id]=[]});
  function item(id){return items.filter(function(x){return x.id===id})[0]}
  function draw(){
    var rest=items.filter(function(x){return !s.placed[x.id]});
    var areas=R.view==='plan'?' style="grid-template-areas:'+R.areas+'"':'';
    var html='<div class="stack">'+head()+'<p class="sub" style="margin:0">'+esc(R.blurb)+' Pick a card, then tap where it belongs.</p>'+
      '<div class="bar"><span>'+s.count+' of '+total+' placed</span><span>'+s.miss+' miss'+(s.miss===1?'':'es')+'</span></div>'+
      '<div class="tray" id="tray">'+rest.map(function(x){return '<button class="item'+(s.sel===x.id?' sel':'')+'" data-i="'+x.id+'">'+esc(x.x)+'</button>'}).join('')+'</div>';
    if(R.topLabel)html+='<div class="edge">'+esc(R.topLabel)+'</div>';
    html+='<div class="targets view-'+R.view+'"'+areas+'>'+R.targets.map(function(t){
      var put=s.inT[t.id],full=put.length>=cap;
      var lab=esc(t.label);
      if(R.view==='blanks')lab=lab.replace('___','<span class="blank">'+(put.length?esc(item(put[0]).x):'&nbsp;')+'</span>');
      var st=[];if(R.view==='plan')st.push('grid-area:'+t.area);if(R.view==='frame')st.push('width:'+t.w+'%');
      var cls='tg'+(full?' full':'')+(s.bad===t.id?' bad':'')+(t.zone?' zone-'+t.zone:'');
      return '<button class="'+cls+'" data-t="'+t.id+'"'+(full?' disabled':'')+(st.length?' style="'+st.join(';')+'"':'')+'><span class="tl">'+lab+'</span>'+(t.sub?'<span class="ts">'+esc(t.sub)+'</span>':'')+
        (R.view==='blanks'?'':put.map(function(id){return '<span class="put">'+esc(item(id).x)+'</span>'}).join(''))+'</button>'}).join('')+'</div>';
    if(R.bottomLabel)html+='<div class="edge">'+esc(R.bottomLabel)+'</div>';
    if(s.note)html+='<div class="fb"><strong>'+esc(s.note.h)+'</strong>'+(s.note.b?'<span>'+esc(s.note.b)+'</span>':'')+'</div>';
    if(s.count===total)html+='<button class="primary" id="fin">Finish round</button>';
    html+='</div>';
    show(html);
    app.querySelectorAll('[data-i]').forEach(function(b){b.onclick=function(){s.sel=+b.getAttribute('data-i');s.note=null;draw()}});
    app.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){
      var tid=b.getAttribute('data-t');
      if(s.sel===null){s.note={h:'Pick a card first.',b:'Then tap the place where it belongs.'};draw();return}
      var it=item(s.sel);
      if(String(it.t)===tid){s.placed[it.id]=true;s.inT[tid].push(it.id);s.count++;s.sel=null;s.bad=null;s.note={h:'Correct.',b:it.n||''};draw()}
      else{s.miss++;s.bad=tid;s.note={h:'Not there.',b:'Try another place.'};draw();setTimeout(function(){s.bad=null;var keep=s.note;draw();},650)}
    }});
    var f=document.getElementById('fin');if(f)f.onclick=function(){done(total-s.miss,total)};
  }
  draw();
}

intro();
})();
</script>
</body>
</html>
